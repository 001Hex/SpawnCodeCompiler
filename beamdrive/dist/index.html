<body>

<canvas id="gl"></canvas>

<!-- ======================================================= loading ==== -->
<div id="loading" class="screen active">
  <div class="load-inner">
    <div class="wordmark"><span class="wm-a">BEAM</span><span class="wm-b">DRIVE</span></div>
    <div class="wordmark-sub">MOBILE</div>
    <div class="bar"><i id="load-bar"></i></div>
    <div id="load-label" class="load-label">Starting up</div>
    <div id="load-tip" class="load-tip"></div>
  </div>
</div>

<!-- ========================================================== home ==== -->
<div id="home" class="screen">
  <div class="home-grid">
    <header class="home-head">
      <div class="wordmark small"><span class="wm-a">BEAM</span><span class="wm-b">DRIVE</span></div>
      <div class="wordmark-sub small">MOBILE &middot; SOFT-BODY DRIVING</div>
    </header>
    <nav class="home-menu">
      <button class="btn primary" data-go="drive">
        <span class="btn-title">DRIVE</span>
        <span class="btn-sub" id="home-drive-sub">Comet 1.4 &middot; Proving Grounds</span>
      </button>
      <button class="btn" data-go="garage"><span class="btn-title">GARAGE</span><span class="btn-sub">Pick a car and a colour</span></button>
      <button class="btn" data-go="maps"><span class="btn-title">MAPS</span><span class="btn-sub">Five places to break it</span></button>
      <button class="btn" data-go="settings"><span class="btn-title">SETTINGS</span><span class="btn-sub">Graphics, assists, audio</span></button>
      <button class="btn" data-go="controls"><span class="btn-title">CONTROLS</span><span class="btn-sub">Touch, tilt or wheel</span></button>
      <button class="btn ghost" data-go="about"><span class="btn-title">ABOUT</span></button>
    </nav>
    <footer class="home-foot">
      <span id="version-tag">v1.0</span>
      <span id="device-tag"></span>
    </footer>
  </div>
</div>

<!-- ======================================================== garage ==== -->
<div id="garage" class="screen panel-screen">
  <div class="topbar">
    <button class="icon-btn" data-go="home">&#8592;</button>
    <h2>GARAGE</h2>
    <button class="icon-btn accent" data-go="drive">DRIVE</button>
  </div>
  <div class="garage-body">
    <div class="car-strip" id="car-strip"></div>
    <div class="car-detail">
      <div class="car-headline">
        <div>
          <h3 id="car-name">&mdash;</h3>
          <div class="car-class" id="car-class"></div>
        </div>
        <div class="car-badge" id="car-drive-badge">FWD</div>
      </div>
      <p class="car-blurb" id="car-blurb"></p>
      <div class="stats" id="car-stats"></div>
      <div class="swatch-row">
        <label>PAINT</label>
        <div id="colour-row" class="swatches"></div>
      </div>
    </div>
  </div>
</div>

<!-- ========================================================== maps ==== -->
<div id="maps" class="screen panel-screen">
  <div class="topbar">
    <button class="icon-btn" data-go="home">&#8592;</button>
    <h2>MAPS</h2>
    <button class="icon-btn accent" data-go="drive">DRIVE</button>
  </div>
  <div class="map-list" id="map-list"></div>
</div>

<!-- ====================================================== settings ==== -->
<div id="settings" class="screen panel-screen">
  <div class="topbar">
    <button class="icon-btn" data-go="home">&#8592;</button>
    <h2>SETTINGS</h2>
    <button class="icon-btn" id="settings-reset">RESET</button>
  </div>
  <div class="scroll" id="settings-body"></div>
</div>

<!-- ====================================================== controls ==== -->
<div id="controls" class="screen panel-screen">
  <div class="topbar">
    <button class="icon-btn" data-go="home">&#8592;</button>
    <h2>CONTROLS</h2>
    <span style="width:64px"></span>
  </div>
  <div class="scroll" id="controls-body"></div>
</div>

<!-- ========================================================= about ==== -->
<div id="about" class="screen panel-screen">
  <div class="topbar">
    <button class="icon-btn" data-go="home">&#8592;</button>
    <h2>ABOUT</h2>
    <span style="width:64px"></span>
  </div>
  <div class="scroll about-body" id="about-body"></div>
</div>

<!-- =========================================================== HUD ==== -->
<div id="hud" class="hud hidden">

  <div class="hud-top-left">
    <div class="damage-card">
      <svg viewBox="0 0 64 104" class="dmg-svg" aria-hidden="true">
        <g id="dmg-groups" stroke="#0c0d11" stroke-width="1.4">
          <rect id="dmg-front" x="12" y="4"  width="40" height="20" rx="5"></rect>
          <rect id="dmg-left"  x="2"  y="26" width="14" height="52" rx="5"></rect>
          <rect id="dmg-right" x="48" y="26" width="14" height="52" rx="5"></rect>
          <rect id="dmg-roof"  x="18" y="30" width="28" height="44" rx="7"></rect>
          <rect id="dmg-rear"  x="12" y="80" width="40" height="20" rx="5"></rect>
        </g>
      </svg>
      <div class="dmg-meta">
        <span class="dmg-label">DAMAGE</span>
        <span class="dmg-value" id="dmg-pct">0%</span>
      </div>
    </div>
  </div>

  <div class="hud-top-right">
    <button class="hud-chip" id="btn-pause">II</button>
    <div class="stat-block" id="stat-block"></div>
  </div>

  <div class="hud-center-top">
    <div id="hud-toast" class="toast"></div>
  </div>

  <div class="hud-bottom-left">
    <div class="dial">
      <svg viewBox="0 0 200 200" class="dial-svg">
        <circle cx="100" cy="100" r="86" class="dial-bg"></circle>
        <path id="dial-track" class="dial-track" fill="none"></path>
        <path id="dial-fill" class="dial-fill" fill="none"></path>
        <path id="dial-redline" class="dial-redline" fill="none"></path>
        <g id="dial-ticks"></g>
        <line id="dial-needle" x1="100" y1="100" x2="100" y2="30" class="dial-needle"></line>
        <circle cx="100" cy="100" r="9" class="dial-hub"></circle>
      </svg>
      <div class="dial-readout">
        <span id="speed-value">0</span>
        <span id="speed-unit" class="dial-unit">MPH</span>
      </div>
    </div>
  </div>

  <div class="hud-bottom-center">
    <div class="rev-strip"><i id="rev-fill"></i><b id="rev-limit"></b></div>
    <div class="gear-row">
      <span class="gear-mode" id="gear-mode">A</span>
      <span class="gear" id="gear-value">N</span>
      <span class="gear-rpm" id="rpm-value">0</span>
    </div>
  </div>

  <div class="hud-bottom-right">
    <div class="g-meter">
      <svg viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="36" class="g-ring"></circle>
        <circle cx="40" cy="40" r="24" class="g-ring faint"></circle>
        <circle cx="40" cy="40" r="12" class="g-ring faint"></circle>
        <line x1="4" y1="40" x2="76" y2="40" class="g-cross"></line>
        <line x1="40" y1="4" x2="40" y2="76" class="g-cross"></line>
        <circle id="g-dot" cx="40" cy="40" r="5" class="g-dot"></circle>
      </svg>
      <span class="g-label" id="g-label">0.0g</span>
    </div>
  </div>
</div>

<!-- ================================================ touch controls ==== -->
<div id="touch" class="touch hidden">
  <div class="look-zone" id="look-zone"></div>

  <div class="pad-left" id="pad-left">
    <button class="pad steer" id="btn-left">&#9664;</button>
    <button class="pad steer" id="btn-right">&#9654;</button>
  </div>

  <div class="wheel-zone hidden" id="wheel-zone">
    <div class="vwheel" id="vwheel"><div class="vwheel-inner">
      <svg viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" class="vw-rim"></circle>
        <circle cx="60" cy="60" r="15" class="vw-hub"></circle>
        <line x1="60" y1="75" x2="60" y2="108" class="vw-spoke"></line>
        <line x1="45" y1="52" x2="12" y2="42" class="vw-spoke"></line>
        <line x1="75" y1="52" x2="108" y2="42" class="vw-spoke"></line>
        <path d="M60 8 l-7 11 h14 z" class="vw-mark"></path>
      </svg>
    </div></div>
  </div>

  <div class="slider-zone hidden" id="slider-zone"><span>drag to steer</span></div>

  <div class="pad-right">
    <button class="pad brake" id="btn-brake">BRAKE</button>
    <button class="pad gas" id="btn-gas">GAS</button>
  </div>

  <div class="aux-row">
    <button class="aux" id="btn-hand">HAND</button>
    <button class="aux" id="btn-cam">CAM</button>
    <button class="aux" id="btn-reset">RESET</button>
    <button class="aux" id="btn-flip">FLIP</button>
  </div>
  <div class="shift-col hidden" id="shift-col">
    <button class="aux" id="btn-up">+</button>
    <button class="aux" id="btn-down">&minus;</button>
  </div>
</div>

<!-- ========================================================= pause ==== -->
<div id="pause" class="screen overlay">
  <div class="pause-card">
    <h2>PAUSED</h2>
    <div class="pause-stats" id="pause-stats"></div>
    <button class="btn primary" id="p-resume"><span class="btn-title">RESUME</span></button>
    <button class="btn" id="p-repair"><span class="btn-title">REPAIR &amp; RESET</span></button>
    <button class="btn" id="p-respawn"><span class="btn-title">RESPAWN AT START</span></button>
    <button class="btn" id="p-settings"><span class="btn-title">SETTINGS</span></button>
    <button class="btn ghost" id="p-quit"><span class="btn-title">QUIT TO MENU</span></button>
  </div>
</div>

<div id="rotate-hint" class="rotate-hint hidden">
  <div>
    <div class="rot-icon">&#8635;</div>
    <p>Turn your phone sideways</p>
  </div>
</div>

<div id="fatal" class="fatal hidden"><div><h2>Could not start</h2><p id="fatal-msg"></p></div></div>

function polar(cx, cy, r, deg) {
var a = (deg - 90) * Math.PI / 180;
return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function arcPath(cx, cy, r, from, to) {
var s = polar(cx, cy, r, to);
var e = polar(cx, cy, r, from);
var large = (to - from) <= 180 ? 0 : 1;
return 'M ' + s[0].toFixed(2) + ' ' + s[1].toFixed(2) +
' A ' + r + ' ' + r + ' 0 ' + large + ' 0 ' + e[0].toFixed(2) + ' ' + e[1].toFixed(2);
}
var DIAL_START = -135, DIAL_END = 135;
UI.prototype.buildDial = function () {
var kph = this.game.settings.units === 'kph';
var spec = B.VEHICLES[this.selectedCar];
var top = spec ? spec.stats.topSpeedKph : 200;
if (!kph) top *= 0.621371;
var step = kph ? 40 : 20;
this._dialMax = Math.max(step * 4, Math.ceil(top * 1.10 / step) * step);
this.els.speedUnit.textContent = kph ? 'KM/H' : 'MPH';
this.els.dialTrack.setAttribute('d', arcPath(100, 100, 76, DIAL_START, DIAL_END));
this.els.dialFill.setAttribute('d', arcPath(100, 100, 76, DIAL_START, DIAL_START));
var ticks = this.els.dialTicks;
ticks.innerHTML = '';
ticks.setAttribute('class', 'dial-ticks');
var n = this._dialMax / step;
for (var i = 0; i <= n; i++) {
var deg = DIAL_START + (DIAL_END - DIAL_START) * (i / n);
var a = polar(100, 100, 66, deg);
var b = polar(100, 100, (i % 2 === 0) ? 56 : 61, deg);
var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
line.setAttribute('x1', a[0].toFixed(1)); line.setAttribute('y1', a[1].toFixed(1));
line.setAttribute('x2', b[0].toFixed(1)); line.setAttribute('y2', b[1].toFixed(1));
ticks.appendChild(line);
if (i % 2 === 0) {
var p = polar(100, 100, 44, deg);
var txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
txt.setAttribute('x', p[0].toFixed(1));
txt.setAttribute('y', (p[1] + 4).toFixed(1));
txt.textContent = String(Math.round(i * step));
ticks.appendChild(txt);
}
}
};

UI.prototype.startDrive = function () {
var self = this, g = this.game;
var map = B.MAPS[this.selectedMap];
var car = B.VEHICLES[this.selectedCar];
this.showroomActive = false;
this.els.loading.classList.add('active');
this.els.loadLabel.textContent = 'Loading ' + map.name;
this.els.loadTip.textContent = TIPS[Math.floor(Math.random() * TIPS.length)];
this.setProgress(0.02);
['home', 'garage', 'maps', 'settings', 'controls', 'about'].forEach(function (id) {
$(id).classList.remove('active');
});
var steps = [
function () { g.clearVehicles(); g.disposeMap(); self.setProgress(0.10, 'Clearing'); },
function () { g.loadMap(map.id, function (p, label) { self.setProgress(0.10 + p * 0.55, label); }); },
function () { self.setProgress(0.72, 'Assembling ' + car.name);
g.spawnPlayer(car.id, self.selectedColor, 0); },
function () {
self.setProgress(0.86, 'Placing traffic');
if (g.settings.trafficCount > 0) g.spawnTraffic(g.settings.trafficCount);
},
function () {
self.setProgress(0.96, 'Warming up');
g.camera.mode = 'chase';
g.camera.snap({
vehicle: g.player, drivetrain: g.playerDrive, terrain: g.terrain,
world: g.world, dt: 1 / 60
});
self.buildDial();
g.applyQuality(g.settings.quality);
},
function () {
self.setProgress(1.0, 'Ready');
self.inGame = true;
self.hideAll();
self.els.loading.classList.remove('active');
self.applyScheme();
g.audio.start();
self.toast(car.name + ' · ' + map.name);
}
];
var i = 0;
function next() {
if (i >= steps.length) return;
try { steps[i++](); } catch (err) {
console.error(err);
self.fatal(err.message || String(err));
return;
}
requestAnimationFrame(function () { requestAnimationFrame(next); });
}
next();
};
UI.prototype.setProgress = function (p, label) {
this.els.loadBar.style.width = Math.round(M.clamp(p, 0, 1) * 100) + '%';
if (label) this.els.loadLabel.textContent = label;
};
UI.prototype.fatal = function (msg) {
$('fatal-msg').textContent = msg;
$('fatal').classList.remove('hidden');
};
UI.prototype.toast = function (msg) {
this.els.toast.textContent = msg;
this.els.toast.classList.add('show');
this.toastTimer = 2.4;
};
UI.prototype.applySettings = function () {
var g = this.game, s = g.settings;
g.applyQuality(s.quality);
if (g.playerDrive) {
g.playerDrive.abs = s.abs;
g.playerDrive.tractionControl = s.tc;
g.playerDrive.stabilityControl = s.esc;
g.playerDrive.autoBox = s.transmission === 'auto';
}
this.buildDial();
this.applyScheme();
};
UI.prototype.refreshSettingsValues = function () {
if (!this._refreshers) return;
for (var i = 0; i < this._refreshers.length; i++) this._refreshers[i]();
};
var DMG_COLORS = ['#2c313c', '#4a4030', '#7a5a22', '#a8461c', '#c9281a'];
function damageFill(v) {
var i = Math.min(DMG_COLORS.length - 1, Math.floor(v * DMG_COLORS.length));
return DMG_COLORS[i];
}
UI.prototype.update = function (dt) {
var g = this.game;
if (this.toastTimer > 0) {
this.toastTimer -= dt;
if (this.toastTimer <= 0) this.els.toast.classList.remove('show');
}
if (this.showroomActive && this._showroomSpin && this.screen === 'garage') {
g.camera.orbitYaw += dt * 0.28;
}
if (!this.inGame || this.screen) return;
var t = g.telemetry;
var kph = g.settings.units === 'kph';
var speed = kph ? t.speedKph : t.speedKph * 0.621371;
this.els.speedValue.textContent = String(Math.round(Math.abs(speed)));
var frac = M.clamp(Math.abs(speed) / this._dialMax, 0, 1);
var deg = DIAL_START + (DIAL_END - DIAL_START) * frac;
this.els.dialFill.setAttribute('d', arcPath(100, 100, 76, DIAL_START, Math.max(deg, DIAL_START + 0.01)));
this.els.dialNeedle.setAttribute('transform', 'rotate(' + deg.toFixed(1) + ' 100 100)');
var spec = g.player ? g.player.spec : null;
if (spec) {
var revFrac = M.clamp(t.rpm / spec.engine.redline, 0, 1.02);
this.els.revFill.style.width = (revFrac * 100).toFixed(1) + '%';
this.els.revStrip.classList.toggle('limit', revFrac > 0.985);
}
this.els.gearValue.textContent = t.gear;
this.els.gearMode.textContent = g.settings.transmission === 'auto' ? 'A' : 'M';
this.els.rpmValue.textContent = Math.round(t.rpm) + ' rpm';
this.els.dmgPct.textContent = Math.round(t.damage * 100) + '%';
var rd = t.regionDamage;
if (rd) {
this.els.dmg.front.setAttribute('fill', damageFill(rd[0]));
this.els.dmg.rear.setAttribute('fill', damageFill(rd[1]));
this.els.dmg.left.setAttribute('fill', damageFill(rd[2]));
this.els.dmg.right.setAttribute('fill', damageFill(rd[3]));
this.els.dmg.roof.setAttribute('fill', damageFill(rd[4]));
}
var gx = M.clamp(t.gForce[0], -2, 2), gy = M.clamp(t.gForce[1], -2, 2);
this.els.gDot.setAttribute('cx', (40 + gx * 17).toFixed(1));
this.els.gDot.setAttribute('cy', (40 - gy * 17).toFixed(1));
this.els.gLabel.textContent = Math.hypot(gx, gy).toFixed(1) + 'g';
if (g.settings.showFps) {
this.els.statBlock.style.display = '';
this.els.statBlock.innerHTML =
'<b>' + Math.round(t.fps) + '</b> fps<br>' +
'<b>' + g.renderer.stats.drawCalls + '</b> draws<br>' +
'<b>' + Math.round(g.renderer.stats.triangles / 1000) + 'k</b> tris<br>' +
'<b>' + t.wheelsDown + '/4</b> down';
} else {
this.els.statBlock.style.display = 'none';
}
};
B.UI = UI;
})();
(function () {
'use strict';
B.VERSION = '1.0.0';
var game = null, ui = null;
var lastTime = 0;
var frameBudget = 0;
var fpsSamples = [];
function fail(msg) {
var f = document.getElementById('fatal');
var m = document.getElementById('fatal-msg');
if (m) m.textContent = msg;
if (f) f.classList.remove('hidden');
var l = document.getElementById('loading');
if (l) l.classList.remove('active');
}
function sizeCanvas() {
if (!game) return;
var w = window.innerWidth;
var h = window.innerHeight;
game.renderer.resize(w, h, window.devicePixelRatio || 1);
game.camera.setAspect(w / Math.max(h, 1));
}
function checkOrientation() {
var hint = document.getElementById('rotate-hint');
if (!hint) return;
var portrait = window.innerHeight > window.innerWidth;
var smallScreen = Math.min(window.innerWidth, window.innerHeight) < 500;
hint.classList.toggle('hidden', !(portrait && smallScreen));
}
function frame(now) {
requestAnimationFrame(frame);
if (!game) return;
var dt = (now - lastTime) / 1000;
if (!isFinite(dt) || dt < 0) dt = 1 / 60;
lastTime = now;
if (dt > 0.25) dt = 0.25;      // a long tab-switch must not teleport the car
var cap = game.settings.fpsCap;
if (cap > 0) {
frameBudget += dt;
var target = 1 / (cap + 0.5);
if (frameBudget < target) return;
dt = frameBudget;
frameBudget = 0;
if (dt > 0.25) dt = 0.25;
}
fpsSamples.push(dt);
if (fpsSamples.length > 30) fpsSamples.shift();
var sum = 0;
for (var i = 0; i < fpsSamples.length; i++) sum += fpsSamples[i];
game.telemetry.fps = fpsSamples.length / Math.max(sum, 1e-6);
try {
if (game.world) {
game.step(dt);
game.render(dt);
}
ui.update(dt);
if (game.input.take('pause') && ui.inGame) ui.setPaused(!game.paused);
} catch (err) {
console.error(err);
fail((err && err.message) || String(err));
game = null;
}
}
function boot() {
var canvas = document.getElementById('gl');
try {
game = new B.Game(canvas);
} catch (e) {
fail('This browser could not start WebGL 2. On iOS make sure you are on iOS 15 ' +
'or newer and that Safari is not in Lockdown Mode. Details: ' + (e.message || e));
return;
}
ui = new B.UI(game);
B.game = game;
B.ui = ui;
game.input.attachKeyboard(window);
ui.build();
sizeCanvas();
checkOrientation();
var unlock = function () {
game.audio.start();
window.removeEventListener('pointerdown', unlock);
window.removeEventListener('keydown', unlock);
};
window.addEventListener('pointerdown', unlock);
window.addEventListener('keydown', unlock);
window.addEventListener('resize', function () {
sizeCanvas();
checkOrientation();
});
window.addEventListener('orientationchange', function () {
setTimeout(function () { sizeCanvas(); checkOrientation(); }, 260);
});
document.addEventListener('visibilitychange', function () {
if (document.hidden) {
game.audio.suspend();
if (ui.inGame && !game.paused) ui.setPaused(true);
} else {
lastTime = performance.now();
}
});
document.addEventListener('touchmove', function (e) {
if (e.target && e.target.closest &&
e.target.closest('.scroll, .car-strip, .map-list, .home-menu, .pause-card, input')) return;
e.preventDefault();
}, { passive: false });
document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
document.addEventListener('dblclick', function (e) { e.preventDefault(); }, { passive: false });
window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
ui.setProgress(0.45, 'Compiling shaders');
requestAnimationFrame(function () {
try {
game.loadMap('showroom');
ui.setProgress(0.80, 'Building the garage');
requestAnimationFrame(function () {
try {
game.spawnPlayer(B.VEHICLES[ui.selectedCar].id, ui.selectedColor, 0);
game.camera.mode = 'orbit';
game.camera.orbitDist = B.VEHICLES[ui.selectedCar].length * 2.0;
ui.showroomActive = true;
game.step(1 / 60);
game.render(1 / 60);
ui.setProgress(1.0, 'Ready');
setTimeout(function () {
ui.show('home');
lastTime = performance.now();
}, 220);
} catch (e2) { fail((e2 && e2.message) || String(e2)); }
});
} catch (e1) { fail((e1 && e1.message) || String(e1)); }
});
lastTime = performance.now();
requestAnimationFrame(frame);
}
if (document.readyState === 'loading') {
document.addEventListener('DOMContentLoaded', boot);
} else {
boot();
}
})();
})();</script>
